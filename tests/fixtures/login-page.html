<!DOCTYPE html>
<html lang="id">
<head><meta charset="utf-8"><title>Masuk | Qasir</title>

</head>
<body>
<div id="app"></div>
<form method="POST" action="https://www.qasir.id/api/auth/login">

  </table>
  <button type="submit">Masuk</button>
</form>
<script>window.__AUTH = { routes: { login: "https://www.qasir.id/api/auth/login" } };</script>
</body>
</html>
